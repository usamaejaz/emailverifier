name: Update disposable domains

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: update-disposable-domains

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run update:data
      - id: changed
        run: git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.changed == 'true'
        run: npm version patch --no-git-tag-version
      - if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/data/disposable-domains.generated.ts
          git commit -m "chore: update disposable domains"
      - if: steps.changed.outputs.changed == 'true'
        run: git push
      - id: release
        shell: bash
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.needed == 'true'
        run: npm run check
      - if: steps.release.outputs.needed == 'true'
        run: npm publish --access public
